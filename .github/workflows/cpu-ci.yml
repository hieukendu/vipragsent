name: cpu-ci

on:
  push:
    branches:
      - main
      - codex/phase-14-5-production-repair
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU core and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[core,dev]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Ruff
        run: ruff check .
      - name: Generate synthetic fixture DAG
        run: python scripts/run_all_experiments.py --config configs/master_run.yaml --mode fixture
      - name: CPU tests
        run: python -m pytest -q -m "not server and not gpu and not azure_live and not model_download"
      - name: Production implementation audit
        run: python scripts/audit_production_implementation.py
      - name: Final production correctness audit
        run: python scripts/audit_final_production_correctness.py
      - name: Validate execution registry and typed stage plans
        run: python scripts/validate_execution_registry.py
      - name: Validate schemas
        run: python scripts/validate_schemas.py
      - name: Regenerate sequential prompts
        run: python scripts/generate_sequential_prompts.py
      - name: Validate sequential prompts
        run: python scripts/validate_sequential_prompts.py
      - name: Audit Table 2 confidence interval protocol
        run: python scripts/audit_table2_confidence_intervals.py
      - name: Final runtime integration audit
        run: python scripts/audit_final_runtime_integration.py

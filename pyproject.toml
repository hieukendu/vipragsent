[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vipragsent"
version = "0.1.0"
description = "Setup-first, reproducible ViPragSent experiment orchestration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
core = [
  "torch>=2.2",
]
ml = [
  "transformers>=4.45",
  "accelerate>=0.34",
  "peft>=0.13",
  "bitsandbytes>=0.43; platform_system != 'Windows'",
]
azure = [
  "openai>=1.54",
  "azure-identity>=1.17",
]
server = [
  "py-vncorenlp==0.1.4",
]
data = [
  "openpyxl>=3.1",
  "kaggle>=1.6",
  "huggingface-hub>=0.25",
]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "server: requires Java/VnCoreNLP, Azure, or other server-only dependencies",
  "gpu: requires CUDA or model weights",
  "azure_live: makes live Azure requests",
  "model_download: downloads model/tokenizer weights",
  "integration_slow: deterministic integration coverage that may take longer",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
